plugins {
	id 'net.minecraftforge.gradle'
}

base {
	archivesName = "${rootProject.archives_base_name}-forge"
}

sourceSets.main {
	java.srcDir rootProject.commonJava
	resources.srcDir rootProject.commonResources
}

minecraft {
	runs {
		configureEach {
			// Shared with the other loaders' runs, so worlds and settings carry over.
			workingDir = rootProject.layout.projectDirectory.dir('run')
			args '-mixin.config=radiante.mixins.json'
		}
		register('client') {
			args '--width', '1280', '--height', '720'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
}

// ForgeGradle 7 has no jar-in-jar support, so SnakeYAML is nested by hand in the format Forge's loader reads
// (META-INF/jarjar/metadata.json, the same one NeoForge uses).
configurations {
	bundled
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.forge_version}")
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
	implementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
	bundled("org.yaml:snakeyaml:${rootProject.snakeyaml_version}") {
		transitive = false
	}
	implementation "org.tukaani:xz:${rootProject.xz_version}"
	bundled("org.tukaani:xz:${rootProject.xz_version}") {
		transitive = false
	}
}

def jarJarMetadata = tasks.register('jarJarMetadata') {
	def output = layout.buildDirectory.file('jarjar/metadata.json')
	def version = rootProject.snakeyaml_version
	def xzVersion = rootProject.xz_version
	outputs.file output
	doLast {
		output.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
			jars: [[
				identifier: [group: 'org.yaml', artifact: 'snakeyaml'],
				version: [range: "[${version},3)", artifactVersion: version],
				path: "META-INF/jarjar/snakeyaml-${version}.jar",
				isObfuscated: false
			], [
				identifier: [group: 'org.tukaani', artifact: 'xz'],
				version: [range: "[${xzVersion},2)", artifactVersion: xzVersion],
				path: "META-INF/jarjar/xz-${xzVersion}.jar",
				isObfuscated: false
			]]
		]))
	}
}

processResources {
	def props = [version: project.version, minecraft_version: rootProject.minecraft_version]
	inputs.properties props
	filesMatching("META-INF/mods.toml") {
		expand props
	}
}

rootProject.packNatives(tasks.jar)

jar {
	archiveFileName.set("${rootProject.archives_base_name}-forge-${project.version}+${rootProject.minecraft_version}.jar")
	manifest {
		attributes 'MixinConfigs': 'radiante.mixins.json'
	}
	from(configurations.bundled) {
		into 'META-INF/jarjar'
	}
	from(jarJarMetadata) {
		into 'META-INF/jarjar'
	}
}
