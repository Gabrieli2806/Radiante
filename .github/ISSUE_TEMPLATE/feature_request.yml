name: Feature request
description: An idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What it should do, and what problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything similar you have seen
      description: Another mod, game or shader that does it, with a link or a screenshot.
