# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.4-snapshot-5
# Jar suffix and the fabric.mod.json requirement (any 26.4 snapshot, pre-release or release).
minecraft_version_label=26.4
minecraft_version_range=~26.4-

# Mod
mod_id=radiante
mod_version=1.1.0
maven_group=com.g2806.radiante
archives_base_name=radiante

# Shared libraries
snakeyaml_version=2.5
xz_version=1.10
mixin_version=0.8.7
mixinextras_version=0.5.0

# Fabric
loom_version=1.18.1
loader_version=0.20.1
fabric_api_version=0.164.1+26.4

# Optional integrations, compiled against but never shipped
distant_horizons_version=3.3.2-26.3
controlify_version=3.5.3+mc26.3

# NeoForge (neoform_version is plain Minecraft for the common module)
moddev_version=2.0.147
neoform_version=26.4-snapshot-5-1
neoforge_version=26.3.0.10-beta

# Forge
forgegradle_version=[7.0.17,8)
forge_version=26.3-66.0.3
# Forge dev runs load classes and resources as one module only when they share an output.
net.minecraftforge.gradle.merge-source-sets=true
