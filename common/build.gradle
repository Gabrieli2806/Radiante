plugins {
	id 'net.neoforged.moddev'
}

// Plain Minecraft, no loader: anything that compiles here runs on every loader. Nothing is built from this module;
// it exists so loader-specific code cannot creep into the shared sources.
neoForge {
	neoFormVersion = rootProject.neoform_version
}

dependencies {
	compileOnly "org.spongepowered:mixin:${rootProject.mixin_version}"
	compileOnly "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
	implementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
	implementation "org.tukaani:xz:${rootProject.xz_version}"

	// Unit tests of the code that needs no running game (the Bedrock pack reader).
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testImplementation "com.google.code.gson:gson:2.13.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
	// Reads the mixins' class files for the test that looks up what every mixin names (MixinTargetsTest).
	testImplementation "org.ow2.asm:asm-tree:9.8"
}

test {
	useJUnitPlatform()
	// Minecraft itself, which the tests otherwise run without: MixinTargetsTest looks the mixins' targets up in it.
	classpath += sourceSets.main.compileClasspath
}

// JNI headers for the native renderer.
compileJava {
	options.compilerArgs += ['-h', rootProject.file('native/include').absolutePath]
}
