buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		// Compresses the native libraries for the jars (compressNatives below).
		classpath "org.tukaani:xz:1.10"
	}
}

// Settings every module shares. Loader specifics live in each module's own build.gradle.
subprojects {
	apply plugin: 'java'

	version = rootProject.mod_version
	group = rootProject.maven_group

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(25)
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
	}

	repositories {
		mavenCentral()
		exclusiveContent {
			forRepository { maven { url 'https://api.modrinth.com/maven' } }
			filter { includeGroup 'maven.modrinth' }
		}
	}

	// Optional mods Radiante integrates with when they are installed. Compile only: nothing of theirs ships, and
	// the code that touches them is only loaded once they are found at run time.
	afterEvaluate {
		dependencies {
			compileOnly("maven.modrinth:distanthorizons:${rootProject.distant_horizons_version}") {
				transitive = false
			}
			compileOnly("maven.modrinth:controlify:${rootProject.controlify_version}") {
				transitive = false
			}
		}
	}
}

// The loader modules compile the common sources as their own, so there is one jar per loader with no extra
// dependency to ship.
ext.commonJava = file('common/src/main/java')
ext.commonResources = file('common/src/main/resources')

// The native libraries (renderer, DLSS, XeSS) are most of a jar's size and compress far better with xz than with the
// jar's own deflate: each one ships as <name>.xz, with natives.sha256 listing what they unpack to, and the mod
// unpacks them into the game folder on first start (RadianteClient.ensureNativeLoaded). Development runs read the
// resources folder directly and keep the plain files.
ext.nativeResources = file('common/src/main/resources/radiante-native')

// DLSS and XeSS are downloaded by the player on request (UpscalerDownloads), not shipped.
def NOT_SHIPPED = ['**/dlss/**', '**/libxess.dll']

def compressNatives = tasks.register('compressNatives') {
	def source = nativeResources
	def output = layout.buildDirectory.dir('compressed-natives')
	inputs.files(fileTree(source) { include '**/*.dll', '**/*.so', '**/*.so.*' ; exclude NOT_SHIPPED })
	outputs.dir output
	doLast {
		def out = output.get().asFile
		project.delete(out)
		out.mkdirs()
		def manifest = new StringBuilder()
		def tree = fileTree(source) { include '**/*.dll', '**/*.so', '**/*.so.*' ; exclude NOT_SHIPPED }
		tree.visit { details ->
			if (details.directory) {
				return
			}
			def relative = details.relativePath.pathString
			def target = new File(out, relative + '.xz')
			target.parentFile.mkdirs()
			def digest = java.security.MessageDigest.getInstance('SHA-256')
			details.file.withInputStream { input ->
				target.withOutputStream { raw ->
					def options = new org.tukaani.xz.LZMA2Options(9)
					def xz = new org.tukaani.xz.XZOutputStream(raw, options, org.tukaani.xz.XZ.CHECK_CRC64)
					byte[] buffer = new byte[1 << 16]
					int n
					while ((n = input.read(buffer)) > 0) {
						digest.update(buffer, 0, n)
						xz.write(buffer, 0, n)
					}
					xz.finish()
				}
			}
			manifest.append(digest.digest().encodeHex().toString()).append('  ').append(relative).append('\n')
		}
		new File(out, 'natives.sha256').text = manifest.toString()
	}
}

// The example shader packs in examples/shaderpacks/ hold only the files they change. A pack whose manifest says
// "extends" (radiante-pt) is zipped as it is: the renderer stages it on radiante-pt when it loads it. Any other
// example is built on top of radiante-pt here, laid out as native/src/shader/CMakeLists.txt lays out the built-in
// pack (the pack, then util/, common/ and the SHaRC headers), with the example's own files over it; that is for
// packs that replace whole files of radiante-pt. ./gradlew shaderPackExamples writes the zips to build/shaderpacks/,
// ready for radiante/shaderpacks/.
def shaderPackExamples = tasks.register('shaderPackExamples') {
	group = 'radiante'
	description = 'Builds the example shader packs (on top of radiante-pt where they do not extend it) into build/shaderpacks.'
}
file('examples/shaderpacks').listFiles()?.findAll { it.isDirectory() && new File(it, 'configs.json').exists() }?.each { example ->
	def id = example.name.replaceAll('[^A-Za-z0-9]', '_')
	def manifest = new groovy.json.JsonSlurper().parse(new File(example, 'configs.json'))
	def extendsBase = (manifest?.radiante ?: manifest?.radiance)?.extends
	def zip
	if (extendsBase) {
		zip = tasks.register("shaderPackExample_${id}", Zip) {
			archiveFileName = "${example.name}.zip"
			destinationDirectory = layout.buildDirectory.dir('shaderpacks')
			from(example) { exclude 'README.md' }
		}
	} else {
		// Staged as files first: copied in order into a folder, a later file replaces an earlier one of the same
		// name, as CMake's file(COPY) does for the built-in pack; a zip would keep both entries.
		def stage = tasks.register("stageShaderPackExample_${id}", Sync) {
			into layout.buildDirectory.dir("shaderpack-staging/${example.name}")
			duplicatesStrategy = DuplicatesStrategy.INCLUDE
			from('native/src/shader/world/ray_tracing/internal/radiante-pt')
			from('native/src/shader/util') { into 'util' }
			from('native/src/common') { into 'common' }
			from('native/extern/sharc/include') { into 'extern/sharc/include' }
			// Last, so the example's files replace radiante-pt's.
			from(example) { exclude 'README.md' }
		}
		zip = tasks.register("shaderPackExample_${id}", Zip) {
			archiveFileName = "${example.name}.zip"
			destinationDirectory = layout.buildDirectory.dir('shaderpacks')
			from(stage)
		}
	}
	shaderPackExamples.configure { dependsOn zip }
}

// The dev clients' game folders (run-fabric, run-forge, run-neoforge) share everything but their mods, configs and
// the renderer Radiante unpacks: two clients on one folder fight over that renderer, the log and the world locks, so
// each keeps its own folder, and what is worth sharing lives once in run-shared.
// - Folders are linked: each loader's folder holds a junction (a symbolic link off Windows) to run-shared's.
// - Files are copied, as the game replaces them whole when it saves them, which would break a link: into the loader's
//   folder before the client starts, when run-shared's copy is newer, and back after it closes.
ext.sharedRunFolders = ['saves', 'resourcepacks', 'shaderpacks', 'replay_recordings',
						'radiante/shaderpacks', 'radiante/bedrock_packs', 'radiante/addons']
ext.sharedRunFiles = ['options.txt', 'servers.dat', 'hotbar.nbt', 'command_history.txt',
					  'radiante/options.properties', 'radiante/pipeline.yaml', 'radiante/presets.json']
// The settings of the built-in shader packs, next to the renderer's own shaders rather than in radiante/shaderpacks.
ext.sharedRunPackSettings = 'radiante/shaders/world/ray_tracing'

// A Windows junction reads as a plain folder to isSymbolicLink; its real path lies elsewhere.
ext.isLinkedFolder = { File f ->
	java.nio.file.Files.isSymbolicLink(f.toPath())
		|| (f.exists() && f.toPath().toRealPath() != f.toPath().toAbsolutePath().normalize())
}

ext.linkFolder = { File link, File target ->
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		// A junction needs no administrator rights or Developer Mode, unlike a symbolic link.
		providers.exec { commandLine 'cmd', '/c', 'mklink', '/J', link.absolutePath, target.absolutePath }.result.get()
	} else {
		java.nio.file.Files.createSymbolicLink(link.toPath(), target.toPath())
	}
}

ext.copyIfNewer = { File from, File to ->
	if (from.isFile() && (!to.exists() || from.lastModified() > to.lastModified())) {
		to.parentFile.mkdirs()
		java.nio.file.Files.copy(from.toPath(), to.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING,
			java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
	}
}

// Links a game folder's folder to a shared one; a folder with files of its own is left alone.
ext.linkRunFolder = { File link, File target ->
	target.mkdirs()
	link.parentFile.mkdirs()
	if (isLinkedFolder(link)) return
	if (link.isDirectory()) {
		if (link.list().length > 0) {
			logger.warn("${link} has files of its own, so it is not linked to ${target}")
			return
		}
		link.delete()
	}
	linkFolder(link, target)
}

// Before a dev client starts: links its folder's shared folders and brings the shared files in.
ext.shareRunIn = { File gameDir ->
	File shared = file('run-shared')
	for (String path : sharedRunFolders) {
		File target = new File(shared, path)
		linkRunFolder(new File(gameDir, path), target)
	}
	// Every loader's screenshots land in the repo's screenshots folder, next to its art and promo subfolders.
	linkRunFolder(new File(gameDir, 'screenshots'), file('screenshots'))
	for (String path : sharedRunFiles) {
		copyIfNewer(new File(shared, path), new File(gameDir, path))
	}
	new File(shared, sharedRunPackSettings).listFiles({ File f -> f.name.endsWith('.txt') } as FileFilter)?.each {
		copyIfNewer(it, new File(gameDir, "${sharedRunPackSettings}/${it.name}"))
	}
}

// After a dev client closes (or fails): its shared files go back to run-shared.
ext.shareRunOut = { File gameDir ->
	File shared = file('run-shared')
	for (String path : sharedRunFiles) {
		copyIfNewer(new File(gameDir, path), new File(shared, path))
	}
	new File(gameDir, sharedRunPackSettings).listFiles({ File f -> f.name.endsWith('.txt') } as FileFilter)?.each {
		copyIfNewer(it, new File(shared, "${sharedRunPackSettings}/${it.name}"))
	}
}

// Wires a loader's runClient to run-shared; the copy back is its own task so a crashed client still saves.
ext.shareRun = { Project project, String folder ->
	File gameDir = file(folder)
	TaskProvider<Task> back = project.tasks.register('shareRunBack') {
		doLast { rootProject.shareRunOut(gameDir) }
	}
	project.tasks.matching { it.name == 'runClient' }.configureEach {
		doFirst { rootProject.shareRunIn(gameDir) }
		finalizedBy back
	}
}

// For the loader modules: the jar takes the compressed natives instead of the plain ones.
ext.packNatives = { Jar jar ->
	jar.dependsOn compressNatives
	jar.exclude { element ->
		def path = element.relativePath.pathString
		def name = element.name
		path.startsWith('radiante-native/') && !name.endsWith('.xz') && name != 'natives.sha256'
			&& (name.endsWith('.dll') || name.endsWith('.so') || name.contains('.so.') || name.endsWith('.lib'))
	}
	jar.from(compressNatives) {
		into 'radiante-native'
	}
}
