plugins {
	id 'net.neoforged.moddev'
}

base {
	archivesName = "${rootProject.archives_base_name}-neoforge"
}

sourceSets.main {
	java.srcDir rootProject.commonJava
	resources.srcDir rootProject.commonResources
}

neoForge {
	version = rootProject.neoforge_version

	runs {
		client {
			client()
			// Its own folder, not Fabric's run: two clients on one game folder fight over the unpacked renderer, the
			// options, the log and the world locks, so starting the loaders together left only one standing.
			gameDirectory = rootProject.file('run-neoforge')
			programArguments.addAll('--width', '1280', '--height', '720')
		}
	}

	mods {
		radiante {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	jarJar(implementation("org.yaml:snakeyaml")) {
		version {
			strictly "[${rootProject.snakeyaml_version},3)"
			prefer rootProject.snakeyaml_version
		}
	}
	jarJar(implementation("org.tukaani:xz")) {
		version {
			strictly "[${rootProject.xz_version},2)"
			prefer rootProject.xz_version
		}
	}
}

processResources {
	def props = [version: project.version, minecraft_version: rootProject.minecraft_version,
				 neoforge_version: rootProject.neoforge_version]
	inputs.properties props
	filesMatching("META-INF/neoforge.mods.toml") {
		expand props
	}
}

rootProject.packNatives(tasks.jar)

jar {
	archiveFileName.set("${rootProject.archives_base_name}-neoforge-${project.version}+${rootProject.minecraft_version}.jar")
}

// The same worlds as the Fabric client (see shareSaves in the root build).
tasks.matching { it.name == 'runClient' }.configureEach {
	doFirst { rootProject.shareSaves(rootProject.file('run-neoforge')) }
}
